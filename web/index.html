<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/" class="nav-brand">Rate Matcha</a>
      <div class="nav-tabs" id="navTabs">
        <button class="nav-tab active" data-view="home">Discover</button>
        <button class="nav-tab" data-view="favourites" id="tabFavourites" style="display:none">Favourites</button>
        <button class="nav-tab" data-view="myreviews" id="tabMyReviews" style="display:none">My Reviews</button>
      </div>
      <div class="nav-auth" id="navAuth">
        <button class="btn btn-outline" id="btnLogin">Log In</button>
        <button class="btn btn-primary" id="btnRegister">Sign Up</button>
      </div>
      <div class="nav-user" id="navUser" style="display:none">
        <span class="user-greeting" id="userGreeting"></span>
        <button class="btn btn-outline btn-sm" id="btnLogout">Log Out</button>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main>
    <!-- Home / Discover view -->
    <div id="viewHome">
      <section class="hero">
        <div class="container">
          <p class="hero-eyebrow">Toronto · Matcha Community</p>
          <h1>Find Your Perfect <em>Matcha</em></h1>
          <p>Discover Toronto's finest matcha cafés, rated by the people who drink it every day.</p>
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search matcha spots in Toronto…" />
            <button class="btn btn-primary" id="btnSearch">Search</button>
            <button class="btn btn-outline" id="btnLocation" title="Use my location">Near Me</button>
          </div>
        </div>
      </section>

      <section class="places-section">
        <div class="container">
          <div class="section-header">
            <h2 id="placesTitle">Matcha Spots</h2>
            <span class="places-count" id="placesCount"></span>
          </div>

          <div class="sort-filter-bar">
            <div class="sort-filter-group">
              <label class="sort-filter-label">Sort by</label>
              <div class="sort-filter-pills" id="sortPills">
                <button class="pill active" data-sort="rating">Best Rating</button>
                <button class="pill" data-sort="name">Name A–Z</button>
                <button class="pill" data-sort="distance">Closest</button>
              </div>
            </div>
            <div class="sort-filter-group">
              <label class="sort-filter-label">Filter</label>
              <div class="sort-filter-pills" id="filterPills">
                <button class="pill" data-filter="images">Has Photo</button>
                <button class="pill" data-filter="reviewed">Has Reviews</button>
                <button class="pill" data-filter="unreviewed">Not Yet Reviewed</button>
                <button class="pill" data-filter="top">Top Rated 4+</button>
              </div>
            </div>
          </div>

          <div class="places-grid" id="placesGrid">
            <div class="loading-spinner"></div>
          </div>
          <div id="scrollSentinel" style="height:1px"></div>
          <div id="loadMoreSpinner" style="display:none;text-align:center;padding:2rem">
            <div class="loading-spinner" style="margin:0 auto"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Favourites view -->
    <div id="viewFavourites" style="display:none">
      <section class="places-section" style="padding-top: calc(var(--nav-height) + 2rem)">
        <div class="container">
          <div class="section-header">
            <h2>My Favourites</h2>
          </div>
          <div class="places-grid" id="favsGrid"></div>
        </div>
      </section>
    </div>

    <!-- My Reviews view -->
    <div id="viewMyReviews" style="display:none">

        <div class="container">
          <div class="section-header">
            <h2>My Reviews</h2>
          </div>
          <div id="myReviewsList"></div>
        </div>

    </div>

    </div>

      <button class="modal-close" id="closeLoginModal">✕</button>
      <h2>Welcome Back 🍵</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Log In</button>
      </form>
      <p class="modal-switch">Don't have an account? <a href="#" id="switchToRegister">Sign up</a></p>
    </div>
  </div>

  <!-- Register modal -->
  <div class="modal-overlay" id="registerModal" style="display:none">
    <div class="modal modal-sm">
      <button class="modal-close" id="closeRegisterModal">✕</button>
      <h2>Join Rate Matcha 🍵</h2>
      <form id="registerForm">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="regName" required placeholder="Your name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required placeholder="Min. 8 characters" minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>
      <p class="modal-switch">Already have an account? <a href="#" id="switchToLogin">Log in</a></p>
    </div>
  </div>
